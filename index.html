    <script>
      (function() {
        // Safe early global error filter for @firebase/firestore stream assertion errors
        function isFirestoreAssertion(msg) {
          if (!msg) return false;
          var str = String(msg);
          return (
            str.indexOf('INTERNAL ASSERTION FAILED') !== -1 ||
            str.indexOf('Unexpected state') !== -1 ||
            str.indexOf('c050') !== -1 ||
            str.indexOf('ca9') !== -1 ||
            str.indexOf('b815') !== -1 ||
            str.indexOf('WatchChangeAggregator') !== -1 ||
            str.indexOf('TargetState') !== -1 ||
            str.indexOf('PersistentListenStream') !== -1 ||
            str.indexOf('PersistentWriteStream') !== -1 ||
            str.indexOf('INTERNAL UNHANDLED ERROR') !== -1 ||
            str.indexOf('__PRIVATE_hardAssert') !== -1 ||
            str.indexOf('__PRIVATE__fail') !== -1 ||
            str.indexOf('forEachTarget') !== -1
          );
        }

        // 1. Intercept console.error before any other script runs
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var fullMsg = args.map(function(a) {
            if (a && a.message) return a.message + ' ' + (a.stack || '');
            if (typeof a === 'object') {
              try { return JSON.stringify(a); } catch (e) { return String(a); }
            }
            return String(a || '');
          }).join(' ');

          if (isFirestoreAssertion(fullMsg)) {
            console.warn('⚡ [Firestore Stream Intercepted in head script]');
            return;
          }
          if (origConsoleError) origConsoleError.apply(console, args);
        };

        // 2. Early window.onerror
        var origOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          var full = String(message || '') + ' ' + String(error && error.message || '') + ' ' + String(error && error.stack || '');
          if (isFirestoreAssertion(full)) {
            console.warn('⚡ [Firestore Stream Intercepted in window.onerror]');
            return true;
          }
          if (typeof origOnError === 'function') {
            return origOnError.apply(this, arguments);
          }
          return false;
        };

        // 3. Early window error event listener (capture phase)
        window.addEventListener('error', function(event) {
          var msg = String(event.message || '') + ' ' + String(event.error && event.error.message || '') + ' ' + String(event.error && event.error.stack || '');
          if (isFirestoreAssertion(msg)) {
            console.warn('⚡ [Firestore Stream Intercepted in error event]');
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.stopPropagation) event.stopPropagation();
          }
        }, true);

        // 4. Early unhandledrejection listener (capture phase)
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = String(reason && reason.message || '') + ' ' + String(reason && reason.stack || '') + ' ' + String(reason || '');
          if (isFirestoreAssertion(msg)) {
            console.warn('⚡ [Firestore Stream Intercepted in unhandledrejection]');
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.stopPropagation) event.stopPropagation();
          }
        }, true);

        try {
          var realFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return realFetch; },
            set: function(val) {
              if (typeof val === 'function') { realFetch = val; }
            }
          });
        } catch (e) {}
      })();
    </script>
